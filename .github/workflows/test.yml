# Build + teemoonTests. A public README is a claim.
#
# Verified locally on iPhone 17 Pro / iOS 26.5. macos-26 is the hosted image
# that ships Xcode 26 and an iOS 26 simulator; macos-15 often does not.
# The job still picks the newest available iPhone destination so it does not
# pin a name the runner does not have.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  teemoon-tests:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # lfs is not optional: without it the LiteRTLM binary checks out as a
      # pointer file and the build fails at package resolution (README §Building).
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -80

      - name: Build and run teemoonTests
        run: |
          # Newest-OS iPhone, OS pinned in the destination: the test bundles
          # deploy to iOS 26.4+, and a bare name resolves to whatever runtime
          # that device happens to have (the image's iPhone 16e is 26.2-only).
          # `name:` is the LAST -showdestinations field — strip " }", don't
          # split on a comma that isn't there.
          PICKED=$(xcodebuild -project teemoon.xcodeproj -scheme teemoon -showdestinations 2>/dev/null \
            | awk -F'name:' '/platform:iOS Simulator/ && /OS:/ && $2 ~ /^iPhone/ {
                n=$2; sub(/,.*$/, "", n); sub(/[ \t]*\}[ \t]*$/, "", n); sub(/[ \t]+$/, "", n)
                os=$1; sub(/.*OS:/, "", os); sub(/[, ].*$/, "", os)
                split(os, v, "."); key=v[1]*1000000+v[2]*1000+v[3]
                if (key>best) { best=key; bestn=n; bestos=os }
              }
              END { if (bestn != "") print bestn "|" bestos }')
          if [ -n "$PICKED" ]; then
            DEST="platform=iOS Simulator,name=${PICKED%%|*},OS=${PICKED##*|}"
          else
            DEST="platform=iOS Simulator,name=iPhone 17"
          fi
          echo "destination: $DEST"
          xcodebuild test \
            -project teemoon.xcodeproj \
            -scheme teemoon \
            -destination "$DEST" \
            -skipMacroValidation \
            -only-testing:teemoonTests \
            -skip-testing:teemoonTests/E2EELiveSmokeTests \
            -skip-testing:teemoonTests/ProductLiveEndpointTests \
            -skip-testing:teemoonTests/ProviderSmokeTests \
            -skip-testing:teemoonTests/GroundingLiveTests \
            -skip-testing:teemoonTests/GLM5BraveSearchTests \
            -skip-testing:teemoonTests/NearAIWhisperProbeTests \
            -skip-testing:teemoonTests/LiteRTLiveTests \
            CODE_SIGNING_ALLOWED=NO

  # Product E2E only — not the whole teemoonUITests target (cameras, paid
  # sends, hang probes). Offline: embedded fake SSE, no API keys.
  teemoon-ui-e2e:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      # lfs: see the note on the teemoon-tests checkout.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -80

      - name: Product E2E
        run: |
          # Same newest-OS pick as teemoon-tests above (UI test bundle has the
          # same 26.4+ floor).
          PICKED=$(xcodebuild -project teemoon.xcodeproj -scheme teemoon -showdestinations 2>/dev/null \
            | awk -F'name:' '/platform:iOS Simulator/ && /OS:/ && $2 ~ /^iPhone/ {
                n=$2; sub(/,.*$/, "", n); sub(/[ \t]*\}[ \t]*$/, "", n); sub(/[ \t]+$/, "", n)
                os=$1; sub(/.*OS:/, "", os); sub(/[, ].*$/, "", os)
                split(os, v, "."); key=v[1]*1000000+v[2]*1000+v[3]
                if (key>best) { best=key; bestn=n; bestos=os }
              }
              END { if (bestn != "") print bestn "|" bestos }')
          if [ -n "$PICKED" ]; then
            DEST="platform=iOS Simulator,name=${PICKED%%|*},OS=${PICKED##*|}"
          else
            DEST="platform=iOS Simulator,name=iPhone 17"
          fi
          echo "destination: $DEST"
          xcodebuild test \
            -project teemoon.xcodeproj \
            -scheme teemoon \
            -destination "$DEST" \
            -skipMacroValidation \
            -only-testing:teemoonUITests/ProductE2ETests \
            -only-testing:teemoonUITests/LocalProviderUITests \
            CODE_SIGNING_ALLOWED=NO
