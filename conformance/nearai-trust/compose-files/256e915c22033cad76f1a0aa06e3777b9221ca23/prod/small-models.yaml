    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    labels:
      com.datadoghq.ad.logs: '[{"source":"sglang","service":"sglang","tags":["model:Qwen/Qwen3.6-35B-A3B-FP8","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}","port:8008","instance:1"]}]'
      nearai.otel.scrape: "true"
      nearai.otel.job: "sglang"
      nearai.otel.service: "sglang"
      nearai.otel.source: "sglang"
      nearai.otel.container_name: "model-sg-qwen36-35b-a3b-fp8-tp1-r1"
      nearai.otel.port: "8000"
      nearai.otel.path: "/metrics"
      nearai.otel.model: "Qwen/Qwen3.6-35B-A3B-FP8"
      nearai.otel.deployment: "small-models"
      nearai.otel.env: "${ENV}"
      nearai.otel.host: "${CVM_HOST}"
      nearai.otel.host_machine: "${CVM_HOST}"
      nearai.otel.cvm_name: "${CVM_NAME}"
      nearai.otel.ip: "${HOST_IP}"

  # ── Qwen3.8-27B on GPU 2 beside the privacy filter; gpu23 GPU 0 is free (Sage on gpu13 GPU 0) ──
  # See x-qwen3-8-27b-dedicated. Uses its own
  # nginx (host :8000 HTTP, :8001 TLS) and its own registrar (profile
  # register-qwen38) so the shared nginx, the shared registrar and their live
  # connections are never recreated or withdrawn by this rollout.

  model-downloader-qwen38:
    <<: *downloader-common
    container_name: model-downloader-qwen38
    command:
      - |
        set -e
        echo "Downloading Qwen/Qwen3.8-27B-FP8..."
        uvx --from 'huggingface_hub[hf_xet]' hf download Qwen/Qwen3.8-27B-FP8 --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
        echo "Download complete."
    volumes:
      - hugginface_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    labels:
      com.datadoghq.ad.logs: '[{"source":"model-downloader","service":"model-downloader","tags":["model:Qwen/Qwen3.8-27B-FP8","deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

  proxy-qwen38-27b:
    <<: *vllm-proxy-common
    # inference-proxy 5faff1b (#329): strict request-model match and LoRA selector
    # refusal. The coloc engine serves the abliterated adapter too, so this proxy
    # must keep VLLM_PROXY_STRICT_REQUEST_MODEL on.
    image: nearaidev/vllm-proxy-rs@sha256:4937ad68d86dcc79871bd52341f2030a71e49bcafdf69d82ca287171aeb43c7b
    container_name: proxy-qwen38-27b
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CLOUD_API_URL=https://cloud-api.near.ai
      - CLOUD_API_USAGE_TOKEN=${CLOUD_API_USAGE_TOKEN}
      - COMPOSE_MANAGER_URL=http://compose-manager:8080
      - LOG_FORMAT=json
      - MODEL_NAME=Qwen/Qwen3.8-27B
      - VLLM_PROXY_STRICT_REQUEST_MODEL=true
      - OHTTP_ENABLED=true
