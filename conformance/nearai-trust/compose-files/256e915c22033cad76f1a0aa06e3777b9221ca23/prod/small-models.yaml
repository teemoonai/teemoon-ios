  # ── Levanto Sage on gpu13 GPU 0 (moved from gpu04 GPU 6, prod/sage.yaml) ──
  # The privacy filter and Qwen3.8 coloc move to GPU 2 on gpu23 (#390); this is unrelated to Sage's host.
  # Moving Sage here frees gpu04 GPU 6 for a fourth GLM replica.
  # The two services are prod/sage.yaml's (#380) unchanged except the GPU, pinned by UUID to gpu13's GPU 0.
  # Never include sage-dstack/sage in a gpu23 deploy: the image is not there and the GPU is gpu13's, so they fail closed.
  # Start them on gpu13 by name, with the SAGE_* values in the env:
  #   POST /compose/up {"tag":"v0.0.N","file":"prod/small-models.yaml","services":["sage-dstack","sage"],"env":{...}}
  # prod/sage-pull.yaml must have put the image in the VM's image store before: compose-manager has no registry
  # login, and this file never pulls the private image (pull_policy: never), so a missing image fails closed.
  #
  # Sage runs with SAGE_CONFIDENTIAL=required: it refuses to start unless the env, the TDX quote, the GPU CC state
  # (Protected PCIe on this board) and the weights all check out, ends TLS itself on 8443 with a key made in the CVM
  # (VM port 8010; the host maps 443 to 8010) and serves /v1/attestation/report.
  # Sage never gets the CVM's dstack socket: sage-dstack exposes only GET /Info and GET /GetQuote to it. Key
  # derivation and event calls (GetKey, EmitEvent, ...) are refused, since our own services use them.
  # Values come from SAGE_-prefixed variables our own env never sets. They are not marked required (${VAR:?}) so
  # that compose/logs, which takes no env, can still read this project's logs; Sage itself refuses to start
  # without them.
  sage-dstack:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: sage-dstack
    restart: unless-stopped
    network_mode: none
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /var/run/sage-dstack:/sock
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/nginx/nginx.conf <<'EOF'
        user root;
        worker_processes 1;
        events { worker_connections 64; }
        http {
          access_log /dev/stdout;
          server {
            listen unix:/sock/dstack.sock;
            location = /Info {
              limit_except GET { deny all; }
              proxy_pass http://unix:/var/run/dstack.sock;
            }
            location = /GetQuote {
              limit_except GET { deny all; }
              proxy_pass http://unix:/var/run/dstack.sock;
            }
            location / {
              return 403;
            }
          }
        }
        EOF
        rm -rf /sock/dstack.sock
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "test", "-S", "/sock/dstack.sock"]
      interval: 5s
      timeout: 3s
      retries: 30

  sage:
    image: levantolabs/sage-v1.4-hopper-pod@sha256:6c15ca25e06d8fb797ab3e8b4992f0df60f6507bb99141cd8d7804c141e0f0e6
    container_name: sage
    pull_policy: never
    restart: unless-stopped
    depends_on:
      sage-dstack:
        condition: service_healthy
    # Only keys on Sage's confidential allowlist; the image's own profile sets everything else.
    environment:
      SAGE_CONFIDENTIAL: required
      HF_TOKEN: ${SAGE_HF_TOKEN}
      HUGGING_FACE_HUB_TOKEN: ${SAGE_HF_TOKEN}
      SERVING_HMAC_SECRET: ${SAGE_SERVING_HMAC_SECRET}
      SAGE_ACME_AWS_ACCESS_KEY_ID: ${SAGE_ACME_AWS_ACCESS_KEY_ID}
      SAGE_ACME_AWS_SECRET_ACCESS_KEY: ${SAGE_ACME_AWS_SECRET_ACCESS_KEY}
      SAGE_ACME_ROUTE53_ZONE_ID: ${SAGE_ACME_ROUTE53_ZONE_ID}
      # Sage ships its own log to Levanto's CloudWatch (write-only key for one log group).
      SAGE_LOG_AWS_ACCESS_KEY_ID: ${SAGE_LOG_AWS_ACCESS_KEY_ID}
      SAGE_LOG_AWS_SECRET_ACCESS_KEY: ${SAGE_LOG_AWS_SECRET_ACCESS_KEY}
      # Enables Sage's content-free /internal/diagnostics endpoint.
      SAGE_ADMIN_TOKEN: ${SAGE_ADMIN_TOKEN}
      # Same GPU as device_ids below (exactly one GPU, as the image requires).
      NVIDIA_VISIBLE_DEVICES: GPU-9ec3a20b-6169-7fdc-a19a-6058228132c1
    volumes:
      - sage-data:/workspace
      - /var/run/sage-dstack/dstack.sock:/var/run/dstack.sock
    ports:
      # Host 8010 is QEMU-forwarded to VM 8010. TLS ends inside Sage.
      - "8010:8443"
    networks:
      - sage
    shm_size: 32gb
    ipc: private
    security_opt:
      - no-new-privileges:true
    mem_limit: 256g
    memswap_limit: 256g
    pids_limit: 8192
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # gpu13 index 0 (PCI 01:00.0); gpu13's small models moved to gpu23.
              device_ids: ["GPU-9ec3a20b-6169-7fdc-a19a-6058228132c1"]
              capabilities: [gpu]

  otelcol-contrib:
    image: otel/opentelemetry-collector-contrib@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    container_name: otelcol-contrib
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    mem_limit: "768m"
    environment:
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      - CVM_NAME=${CVM_NAME:-unknown}
      - CVM_HOST=${CVM_HOST:-unknown}
      - DD_HOSTNAME=${DD_HOSTNAME:-unknown}
      - ENV=${ENV:-unknown}
      - HOST_IP=${HOST_IP:-unknown}
    expose:
      - "4317"
      - "4318"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol_app_storage:/var/lib/otelcol-contrib
    configs:
      - source: otelcol_app_config
        target: /etc/otelcol-contrib/config.yaml
        mode: 0444
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      com.datadoghq.ad.logs: '[{"source":"otelcol-contrib","service":"otelcol-contrib","tags":["deployment:small-models","env:${ENV}","host:${CVM_HOST}","ip:${HOST_IP}"]}]'

networks:
  sage:
    name: sage_net
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.250.0/24
  default:
    external: true
    name: dstack_default

volumes:
  otelcol_app_storage:
  hugginface_cache:
  vllm_cache:
  kernel_cache:
  ghost:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0700"
  qwen38_kernel_cache:
  qwen38_coloc_kernel_cache:
  lora_adapter:
  sage-data:
  certs:
    external: true
    name: certs

configs:
  otelcol_app_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        filelog/docker_containers:
          include: [/var/lib/docker/containers/*/*-json.log]
          start_at: end
          storage: file_storage
          include_file_path: true
          operators:
            - type: json_parser
              parse_from: body
              parse_to: attributes
              timestamp:
                parse_from: attributes.time
                layout_type: gotime
                layout: '2006-01-02T15:04:05.999999999Z07:00'
              on_error: send_quiet
            - type: move
              from: attributes.log
              to: body
              if: 'attributes.log != nil'
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
              if: 'attributes.stream != nil'
            - type: remove
              field: attributes.time
              if: 'attributes.time != nil'
            - type: regex_parser
              parse_from: attributes["log.file.path"]
              regex: '/var/lib/docker/containers/(?P<container_id>[a-f0-9]{12})[a-f0-9]*/'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model:(?P<model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'model_path:(?P<model_path>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'served_model:(?P<served_model>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'precision:(?P<precision>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'deployment:(?P<deployment>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'ip:(?P<ip>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'port:(?P<port>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'env:(?P<env>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'host:(?P<host>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'instance:(?P<instance>[^",\]]+)'
              on_error: send_quiet
            - type: regex_parser
              parse_from: attributes["attrs"]["com.datadoghq.ad.logs"]
              regex: 'replica:(?P<replica>[^",\]]+)'
              on_error: send_quiet
            - type: add
              field: attributes["service.name"]
              value: cvm-docker

        prometheus/apps:
          config:
            scrape_configs:
              - job_name: sglang-model-sg-qwen36-35b-a3b-fp8-tp1-r1
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-sg-qwen36-35b-a3b-fp8-tp1-r1:8000']
                    labels:
                      service: "sglang"
                      source: "sglang"
                      container_name: "model-sg-qwen36-35b-a3b-fp8-tp1-r1"
                      model: "Qwen/Qwen3.6-35B-A3B-FP8"
                      deployment: "small-models"
                      env: "${ENV}"
                      host: "${CVM_HOST}"
                      host_machine: "${CVM_HOST}"
                      cvm_name: "${CVM_NAME}"
                      ip: "${HOST_IP}"
                      port: "8008"
                      instance: "1"
              - job_name: sglang-model-sg-glm53-w4afp8-tp2-r1a
                scrape_interval: 15s
                metrics_path: /metrics
                static_configs:
                  - targets: ['model-sg-glm53-w4afp8-tp2-r1a:8000']
                    labels:
                      service: "sglang"
                      source: "sglang"
